[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-medical-data-wgan-gp"
version = "2.0.0"
description = "MedGAN-Synthesizer: Wasserstein GAN with Gradient Penalty Clinical Generator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
synthetic-medical-data-wgan-gp = "medgan_synthesizer.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/synthetic-medical-data-wgan-gp"
Repository = "https://github.com/abusuraihsakhri/synthetic-medical-data-wgan-gp.git"
