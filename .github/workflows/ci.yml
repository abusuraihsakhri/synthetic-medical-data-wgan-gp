name: Tests and static validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
          python -m pip check
      - name: Python compilation
        run: python -m compileall -q agents medgan_synthesizer cli.py enrichment.py simulator.py
      - name: Tests
        run: python -m pytest -q
      - name: CLI batch smoke test
        run: python cli.py batch -i sample.csv -o /tmp/threshold-results.csv
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          assert len(scripts) == 1, "Expected a single inline script"
          subprocess.run(["node", "--check"], input=scripts[0], text=True, check=True)
          PY
