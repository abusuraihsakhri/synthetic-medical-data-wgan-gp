version: '3.8'

services:
  synthetic-medical-data-wgan-gp:
    build: .
    container_name: synthetic-medical-data-wgan-gp
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=synthetic-medical-data-wgan-gp-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
